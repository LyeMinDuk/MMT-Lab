<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMT - MinDukLab</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--text:#1c2330;--muted:#667085;--line:#e3e7ee;
  --accent:#2563eb;--accent-soft:#e8f0fe;--ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf3e1;
  --code-bg:#f1f3f7;--mark:#ffe58a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141b;--surface:#171c26;--text:#e6e9ef;--muted:#98a2b3;--line:#283042;
  --accent:#6ea0ff;--accent-soft:#1b2a4a;--ok:#4ade80;--ok-soft:#14301f;--warn:#f5b455;--warn-soft:#352614;
  --code-bg:#0e121a;--mark:#6b5a12}
}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:13px}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;font-size:17px;color:var(--text)}
nav{display:flex;gap:4px;flex:1}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav a.on{background:var(--accent-soft);color:var(--accent);text-decoration:none}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.menu>summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:38px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--text);font:inherit;cursor:pointer}
.menu .pop button:hover{background:var(--accent-soft)}
.menu .pop .danger{color:#dc2626}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:26px 0 10px}h3{font-size:15px;margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:13px}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text)}
a.card:hover{border-color:var(--accent);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card .ttl{font-weight:600;margin-bottom:8px}
.prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog.full>i{background:var(--ok)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.resume{border-color:var(--accent);background:var(--accent-soft)}
.crumb{margin-bottom:10px;display:inline-block}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
.tools label{font-weight:600;display:block;margin-bottom:4px}
input[type=text],input[type=search],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input[type=text]:focus,input[type=search]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:90px;resize:vertical}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.step.done{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)),var(--surface)}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer;flex:none}
.step .body{flex:1;min-width:0}
.step .num{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.step .t{font-weight:600}
.step .d{color:var(--muted);margin-top:2px}
.step.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.cmd{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--code-bg);border-radius:8px;padding:7px 10px}
button.btn,.copy{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
button.btn:hover,.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy.ok{border-color:var(--ok);color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0}
details.box>summary{cursor:pointer;padding:11px 14px;font-weight:600}
details.box>.in{padding:0 16px 14px}
.md h1{font-size:18px}.md h2{font-size:16px;margin-top:18px}.md h3{font-size:15px}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-left:22px}
.md blockquote{margin:10px 0;padding:6px 12px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0}
.md :not(pre)>code{background:var(--code-bg);padding:1px 5px;border-radius:5px}
.md .code{position:relative;margin:10px 0}
.md pre{margin:0;background:var(--code-bg);border-radius:8px;padding:10px 12px;overflow-x:auto}
.md .code .copy{position:absolute;top:6px;right:6px;opacity:.85}
.md .tblw{overflow-x:auto;margin:10px 0}
.md table{border-collapse:collapse;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--code-bg)}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0}
.hit>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hit>summary b{font-weight:600}
.hit>.md{padding:0 16px 12px}
.hit.pit>summary .tag{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2330;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:9;max-width:90vw}
footer{max-width:920px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:13px}
@media (max-width:560px){.cmd{flex-direction:column}.cmd .copy{align-self:flex-start}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/">MMT-Lab</a>
  <nav><a href="#/" id="nav-home">Bài lab</a><a href="#/cmd" id="nav-cmd">Tra lệnh</a></nav>
  <details class="menu"><summary>Dữ liệu ▾</summary><div class="pop">
    <button id="m-export">Xuất tiến độ (.json)</button>
    <button id="m-import">Nhập tiến độ…</button>
    <button id="m-reset" class="danger">Xóa toàn bộ tiến độ</button>
  </div></details>
  <input type="file" id="file-import" accept="application/json" hidden>
</div></header>
<main id="app"></main>
<footer>Tiến độ chỉ lưu trong trình duyệt này (localStorage); muốn mang sang máy khác thì dùng Dữ liệu → Xuất/Nhập. Trang không chấm được file .pkt: chạy lệnh <code>check.py</code> ở máy bạn.</footer>

   "de": "# Chương 1 - Thực hành 01: Xây dựng mạng, cấu hình IP và ping\n\nNguồn: slide \"Chương 1 - Thực hành\" (phần Bài tập).\n\n> **Lưu ý về dữ liệu.** Sơ đồ mạng và \"bảng thông số\" của bài này là hình, không có trong bản slide dạng chữ. Phần dưới chỉ gồm những gì có chữ. Tên thiết bị `LT0`, `PC0`, `S0`, `R0` lấy từ các bước trong slide; loại thiết bị là giả định hợp lý (laptop, PC, server, router 2811). Sửa `checks.json` nếu bạn đặt tên khác hoặc khi có đủ thông tin từ hình.\n\n## Bước 1 - Xây dựng mô hình\nĐưa thiết bị vào workspace (laptop, PC, server, router 2811, switch 2960) và nối cáp theo sơ đồ trong slide. Dùng cáp Straight-Through; Cross-Over chỉ để nối hai router.\n\n## Bước 2 - Cấu hình địa chỉ IP\n- **Đầu cuối** (LT0, PC0, S0 và các máy khác): Config > FastEthernet0, chọn Static, điền IPv4/IPv6 theo bảng thông số trong slide. Mọi PC, Laptop, Server cấu hình giống LT0.\n- **Router R0**, cổng Fa0/0 (từ slide):\n  - IPv4: `132.54.78.1` mask `255.255.255.0`\n  - IPv6: `2AB1:1D8C:ABBA::1/64`\n  - Cổng Fa0/1 làm tương tự theo bảng thông số (giá trị có trong hình, không có trong bản chữ).\n- Nhớ bật cổng (`no shut`).\n\n## Bước 3 - Kiểm tra kết nối\n- Trên đầu cuối: Command Prompt, `ping` IPv4 và IPv6 tới các thiết bị khác, xem kết quả.\n- Trên R0: CLI, `ping` v4/v6 tới các đầu cuối.\n\nGợi ý hướng kiểm tra: ping IPv6 giữa hai mạng khác nhau cần router bật `ipv6 unicast-routing`.\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-1/thuc-hanh-01-xay-dung-mang --step 2\n```\nBộ chấm chỉ kiểm tra thiết bị có mặt (bước 1) và địa chỉ, trạng thái cổng Fa0/0 của R0 (bước 2 trở đi). Các phần còn lại phụ thuộc vào hình slide.\n"

op về cổng router đầu kia. Rồi chạy `show protocols` trên cả hai router và ping từ máy ở NET1 tới `74.54.33.131` và `2DCF:4A6::3` (các máy ở NET2).\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-3/thuc-hanh-02-dinh-tuyen --step 1\npython tools/check.py bai.pkt --lab labs/chuong-3/thuc-hanh-02-dinh-tuyen --step 2\n```\n- Bước 1 chấm bài tập 01, bước 2 chấm bài tập 02.\n- Bước 2 mô phỏng đường đi theo bảng định tuyến (kết nối, tĩnh, mặc định), nên **cả ba cách đều được chấp nhận**; nó báo router nào thiếu tuyến, next-hop sai hay chưa bật IPv6 routing.\n- Bộ chấm chỉ xét cấu hình router, không xét PC và không thay cho ping thật.\n"

<script>

/* ---------- markdown nhỏ (đủ cho de.md, cheatsheet, lỗi hay gặp) ---------- */
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
}
function splitRow(line) {
  line = line.trim().replace(/^\|/, "").replace(/\|$/, "");
  const cells = []; let cur = "", tick = false;
  for (const ch of line) {
    if (ch === "`") tick = !tick;
    if (ch === "|" && !tick) { cells.push(cur.trim()); cur = ""; } else cur += ch;
  }
  cells.push(cur.trim()); return cells;
}
const isSep = l => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
function md(src) {
  const L = src.replace(/\r\n/g, "\n").split("\n"); let out = "", i = 0;
  while (i < L.length) {
    const line = L[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      out += `<div class="code"><button class="copy" data-copy>Chép</button><pre><code>${esc(buf.join("\n"))}</code></pre></div>`;
    } else if (/^\s*$/.test(line)) { i++; }
    else if (/^#{1,3}\s/.test(line)) {
      const n = line.match(/^#+/)[0].length; out += `<h${n}>${inline(line.replace(/^#+\s+/, ""))}</h${n}>`; i++;
    } else if (/^---+\s*$/.test(line)) { out += "<hr>"; i++; }
    else if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${inline(buf.join(" "))}</blockquote>`;
    } else if (/^\s*\|/.test(line) && i + 1 < L.length && isSep(L[i + 1])) {
      const head = splitRow(line); i += 2; const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(splitRow(L[i++]));
      out += `<div class="tblw"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) items.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      const tag = ordered ? "ol" : "ul";
      out += `<${tag}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}>`;
    } else {
      const buf = [];
      while (i < L.length && !/^\s*$/.test(L[i]) && !/^(```|#{1,3}\s|>|\s*\||\s*([-*]|\d+\.)\s+|---)/.test(L[i])) buf.push(L[i++]);
      if (!buf.length) { buf.push(L[i++]); }
      out += `<p>${inline(buf.join(" "))}</p>`;
    }
  }
  return out;
}

/* ---------- tiện ích ---------- */
const fold = s => s.toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const foldKeep = s => [...s].map(c => { const f = c.toLowerCase().replace("đ", "d").normalize("NFD")[0]; return f; }).join("");
function highlight(root, words) {
  if (!words.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue, f = foldKeep(text);
    if (f.length !== text.length) continue;
    const ranges = [];
    for (const w of words) { let p = 0; while ((p = f.indexOf(w, p)) !== -1) { ranges.push([p, p + w.length]); p += w.length; } }
    if (!ranges.length) continue;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [a, b] of merged) {
      if (a > pos) frag.append(text.slice(pos, a));
      const m = document.createElement("mark"); m.textContent = text.slice(a, b); frag.append(m); pos = b;
    }
    if (pos < text.length) frag.append(text.slice(pos));
    node.replaceWith(frag);
  }
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "Đã chép"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = o; btn.classList.remove("ok"); }, 1200); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const src = b.dataset.copy ? b.dataset.copy : (b.parentElement.querySelector("code")?.textContent || "");

});

const chapters = () => [...new Set([...DATA.labs.map(l => l.chapter), ...DATA.cheatsheets.map(c => c.chapter)].filter(Boolean))].sort((a, b) => a - b);
const fmtTime = ts => new Date(ts).toLocaleString("vi-VN", {hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit"});
const progBar = (d, n) => `<div class="prog ${d === n && n ? "full" : ""}"><i style="width:${n ? Math.round(d * 100 / n) : 0}%"></i></div>`;

/* ---------- trang chủ ---------- */
function homeView() {
  const totalSteps = DATA.labs.reduce((a, l) => a + l.steps.length, 0), totalDone = DATA.labs.reduce((a, l) => a + doneOf(l), 0);
  let h = `<h1>Luyện thực hành Mạng máy tính</h1><p class="muted">Cisco Packet Tracer 8.1.1.0022 · đã xong <b>${totalDone}/${totalSteps}</b> bước</p>`;
  const last = labById(S.last);
  if (last && doneOf(last) < last.steps.length) {
    const next = last.steps.find(s => !S.steps[last.id]?.[s.n]);
    h += `<a class="card resume" href="#/lab/${last.id}" style="margin:14px 0"><div class="small muted">Tiếp tục</div><div class="ttl">${esc(last.short)}</div><div class="small">Bước tiếp theo: <b>${next.n}</b>. ${inline(next.title)}</div></a>`;
  }
  for (const ch of chapters()) {
    h += `<h2>Chương ${ch}</h2><div class="grid">`;
    for (const c of DATA.cheatsheets.filter(c => c.chapter === ch))
      h += `<a class="card" href="#/cmd?src=${c.id}"><div class="ttl">${esc(c.short)}</div><span class="tag">Cheatsheet</span> <span class="small muted">${c.sections.length} mục</span></a>`;
    for (const l of DATA.labs.filter(l => l.chapter === ch)) {
      const d = doneOf(l), n = l.steps.length;
      h += `<a class="card" href="#/lab/${l.id}"><div class="ttl">${esc(l.short)}</div>${progBar(d, n)}<div class="small muted" style="margin-top:6px">${d}/${n} bước ${d === n && n ? '<span class="tag ok">xong</span>' : ""}</div></a>`;
    }
    h += "</div>";
  }
  h += `<details class="box"><summary>Lệnh công cụ khác</summary><div class="in md">` +
    `<p>Xem script đọc được gì từ file (khi chấm sai nghi do đọc file):</p><div class="code"><button class="copy" data-copy>Chép</button><pre><code>python tools/check.py bai.pkt --dump</code></pre></div>` +
    `<p>Giải mã để gửi Claude xem:</p><div class="code"><button class="copy" data-copy>Chép</button><pre><code>python tools/pkt2xml.py bai.pkt --summary --configs</code></pre></div></div></details>`;
  app.innerHTML = h;
}

/* ---------- trang một bài lab ---------- */
function cmdFor(lab, n) {
  let f = (S.file || "bai.pkt").replace(/\{n\}/g, n == null ? lab.steps.length : n);
  if (/\s/.test(f)) f = `"${f}"`;
  return `python tools/check.py ${f} --lab labs/${lab.id}` + (n == null ? "" : ` --step ${n}`);
}
function stepsHtml(lab) {
  return lab.steps.map(s => {
    const ts = S.steps[lab.id]?.[s.n];
    return `<li class="step ${ts ? "done" : ""}" data-n="${s.n}">
      <input type="checkbox" aria-label="Bước ${s.n} đã xong" ${ts ? "checked" : ""}>
      <div class="body"><div class="num">Bước ${s.n}${ts ? ` · xong ${fmtTime(ts)}` : ""}</div>
        <div class="t">${inline(s.title)}</div>${s.detail ? `<div class="d">${inline(s.detail)}</div>` : ""}
        <div class="small muted" style="margin-top:6px">${s.checks} tiêu chí chấm${s.devices.length ? " · " + esc(s.devices.slice(0, 4).join(", ")) + (s.devices.length > 4 ? ` +${s.devices.length - 4}` : "") : ""}</div>
        <div class="cmd"><code>${esc(cmdFor(lab, s.n))}</code><button class="copy" data-copy="${esc(cmdFor(lab, s.n))}">Chép lệnh</button></div>
      </div></li>`;
  }).join("");
}
function labView(id) {
  const lab = labById(id);
  if (!lab) { app.innerHTML = `<p>Không tìm thấy bài <code>${esc(id)}</code>. <a href="#/">Về danh sách</a></p>`; return; }
  S.last = id; save();
  const pits = DATA.pitfalls.filter(p => p.chapter === lab.chapter), sheets = DATA.cheatsheets.filter(c => c.chapter === lab.chapter);
  app.innerHTML = `<a class="crumb small" href="#/">← Danh sách bài</a><h1>${esc(lab.title)}</h1>
    <div id="lab-prog"></div>
    <div class="tools"><label for="pkt">Tên file .pkt đang chấm</label>
      <input type="text" id="pkt" value="${esc(S.file)}" spellcheck="false">
      <div class="small muted" style="margin-top:4px">Lưu một file .pkt sau mỗi bước. Có thể viết <code>{n}</code> để tự thay bằng số bước, ví dụ <code>bai-b{n}.pkt</code>. Chạy lệnh trong thư mục repo.</div>
      <div class="row" style="margin-top:8px"><span class="small muted">Chấm bước cuối:</span><code id="cmd-all" class="small">${esc(cmdFor(lab, null))}</code><button class="copy" id="cmd-all-copy" data-copy="${esc(cmdFor(lab, null))}">Chép</button></div></div>
    <ol class="steps" id="steps">${stepsHtml(lab)}</ol>
    <div class="row" style="margin-top:12px"><button class="btn" id="reset-lab">Làm lại bài này</button>${sheets.map(c => `<a class="btn" style="padding:5px 11px;border:1px solid var(--line);border-radius:8px" href="#/cmd?src=${c.id}">Cheatsheet: ${esc(c.short)}</a>`).join("")}</div>
    ${pits.length ? `<details class="box"><summary>Lỗi hay gặp ở chương ${lab.chapter} (${pits.length})</summary><div class="in md"><ol>${pits.map(p => `<li><strong>${inline(p.title)}</strong> ${inline(p.md)}</li>`).join("")}</ol></div></details>` : ""}
    <details class="box"><summary>Đề đầy đủ</summary><div class="in md">${md(lab.de)}</div></details>
    <details class="box"><summary>Ghi chú của tôi</summary><div class="in"><textarea id="note" placeholder="Lỗi mình đã gặp, lệnh hay quên...">${esc(S.notes[id] || "")}</textarea></div></details>`;
  const refresh = () => {
    const d = doneOf(lab), n = lab.steps.length;
    $("#lab-prog").innerHTML = `${progBar(d, n)}<div class="small muted" style="margin:6px 0 14px">${d}/${n} bước ${d === n ? "· hoàn thành" : ""}</div>`;
  };
  refresh();
  $("#steps").addEventListener("change", e => {
    if (e.target.type !== "checkbox") return;
    const li = e.target.closest(".step"), n = li.dataset.n;
    S.steps[id] = S.steps[id] || {};
    if (e.target.checked) S.steps[id][n] = Date.now(); else delete S.steps[id][n];
    save(); $("#steps").innerHTML = stepsHtml(lab); refresh();
  });
  $("#pkt").addEventListener("input", e => {
    S.file = e.target.value.trim() || "bai.pkt"; save();
    $("#steps").innerHTML = stepsHtml(lab);
    $("#cmd-all").textContent = cmdFor(lab, null); $("#cmd-all-copy").dataset.copy = cmdFor(lab, null);
  });
  $("#reset-lab").addEventListener("click", () => {
    if (!confirm("Bỏ tick mọi bước của bài này?")) return;
    delete S.steps[id]; save(); $("#steps").innerHTML = stepsHtml(lab); refresh();
  });
  let t; $("#note").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { S.notes[id] = e.target.value; save(); }, 400); });
}

/* ---------- tra lệnh ---------- */
function entries() {
  const e = [];
  for (const c of DATA.cheatsheets) {
    if (c.intro) e.push({src: c.id, label: c.short, head: "Giới thiệu", md: c.intro, kind: "sheet"});
    for (const s of c.sections) e.push({src: c.id, label: c.short, head: s.h, md: s.md, kind: "sheet"});
  }
  for (const p of DATA.pitfalls) e.push({src: "loi-" + p.chapter, label: "Lỗi hay gặp · chương " + p.chapter, head: p.title.replace(/\.$/, ""), md: p.md, kind: "pit"});
  return e;
}
function cmdView(params) {
  const all = entries();
  const srcs = [...new Set(all.map(e => e.src))].map(s => ({id: s, label: all.find(e => e.src === s).label}));
  let q = params.get("q") || "", src = params.get("src") || "";
  app.innerHTML = `<h1>Tra lệnh</h1><p class="muted">Tìm trong cheatsheet và các lỗi hay gặp. Không cần gõ dấu tiếng Việt. Phím <kbd>/</kbd> để nhảy vào ô tìm.</p>
    <input type="search" id="q" placeholder="vd: trunk, ipv6 route, clock rate, màu cam" value="${esc(q)}" autocomplete="off">
    <div class="chips" id="chips"></div><div id="res"></div>`;
  const render = () => {
    $("#chips").innerHTML = [{id: "", label: "Tất cả"}, ...srcs].map(s => `<button class="chip ${s.id === src ? "on" : ""}" data-src="${s.id}">${esc(s.label)}</button>`).join("");
    const words = fold(q).split(/\s+/).filter(Boolean);
    const hits = all.filter(e => (!src || e.src === src) && words.every(w => fold(e.head + " " + e.md).includes(w)));
    const res = $("#res");
    if (!hits.length) { res.innerHTML = `<p class="muted">Không có mục nào khớp${q ? ` "${esc(q)}"` : ""}.</p>`; return; }
    res.innerHTML = `<p class="small muted">${hits.length} mục${words.length ? "" : " (bấm để mở)"}</p>` + hits.map((e, i) =>
      `<details class="hit ${e.kind}" ${words.length || src ? "open" : ""}><summary><b>${inline(e.head)}</b><span class="tag">${esc(e.label)}</span></summary><div class="md">${e.kind === "pit" ? `<p>${inline(e.md)}</p>` : md(e.md)}</div></details>`).join("");
    if (words.length) $$("#res summary, #res .md").forEach(el => highlight(el, words));
  };
  render();
  const sync = () => { const p = new URLSearchParams(); if (q) p.set("q", q); if (src) p.set("src", src); history.replaceState(null, "", "#/cmd" + (p.toString() ? "?" + p : "")); };
  $("#q").addEventListener("input", e => { q = e.target.value; sync(); render(); });
  $("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; src = b.dataset.src; sync(); render(); });
  if (q) $("#q").focus();
}

/* ---------- định tuyến ---------- */
function route() {
  const raw = location.hash.replace(/^#/, "") || "/", [path, qs] = raw.split("?"), params = new URLSearchParams(qs || "");
  $$("nav a").forEach(a => a.classList.remove("on"));
  window.scrollTo(0, 0);
  let m;
  if ((m = path.match(/^\/lab\/(.+)$/))) { $("#nav-home").classList.add("on"); labView(decodeURI(m[1])); }
  else if (path === "/cmd") { $("#nav-cmd").classList.add("on"); cmdView(params); }
  else { $("#nav-home").classList.add("on"); homeView(); }
}
addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.key !== "/" || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  if (!location.hash.startsWith("#/cmd")) location.hash = "#/cmd";
  setTimeout(() => $("#q")?.focus(), 0);
});

/* ---------- menu dữ liệu ---------- */
const menu = $(".menu");
$("#m-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "mmt-lab-tien-do.json"; a.click(); URL.revokeObjectURL(a.href); menu.open = false;
});
$("#m-import").addEventListener("click", () => { $("#file-import").click(); menu.open = false; });
$("#file-import").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (typeof j !== "object" || !j || typeof j.steps !== "object") throw new Error("sai định dạng");
    S = Object.assign(blank(), j); save(); route(); toast("Đã nhập tiến độ.");
  } catch (err) { toast("File không hợp lệ: " + err.message); }
  e.target.value = "";
});
$("#m-reset").addEventListener("click", () => {
  menu.open = false;
  if (!confirm("Xóa toàn bộ tiến độ, ghi chú và tên file đã lưu?")) return;
  S = blank(); save(); route(); toast("Đã xóa.");
});
document.addEventListener("click", e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });

route();
</script>
</body>
</html>
