<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MMT - MinDukLab</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--text:#1c2330;--muted:#667085;--line:#e3e7ee;
  --accent:#2563eb;--accent-soft:#e8f0fe;--ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf3e1;
  --code-bg:#f1f3f7;--mark:#ffe58a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141b;--surface:#171c26;--text:#e6e9ef;--muted:#98a2b3;--line:#283042;
  --accent:#6ea0ff;--accent-soft:#1b2a4a;--ok:#4ade80;--ok-soft:#14301f;--warn:#f5b455;--warn-soft:#352614;
  --code-bg:#0e121a;--mark:#6b5a12}
}
:root[data-th=light]{--bg:#f6f7f9;--surface:#fff;--text:#1c2330;--muted:#667085;--line:#e3e7ee;--accent:#2563eb;--accent-soft:#e8f0fe;--ok:#15803d;--ok-soft:#e7f6ec;--warn:#b45309;--warn-soft:#fdf3e1;--code-bg:#f1f3f7;--mark:#ffe58a}
:root[data-th=dark]{--bg:#10141b;--surface:#171c26;--text:#e6e9ef;--muted:#98a2b3;--line:#283042;--accent:#6ea0ff;--accent-soft:#1b2a4a;--ok:#4ade80;--ok-soft:#14301f;--warn:#f5b455;--warn-soft:#352614;--code-bg:#0e121a;--mark:#6b5a12}
*{box-sizing:border-box}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:1rem/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
code,pre{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:0.8125rem}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:920px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{font-weight:700;font-size:1.0625rem;color:var(--text)}
nav{display:flex;gap:4px;flex:1}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted);font-weight:600}
nav a.on{background:var(--accent-soft);color:var(--accent);text-decoration:none}
.menu{position:relative}
.menu>summary{list-style:none;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.menu>summary::-webkit-details-marker{display:none}
.menu .pop{position:absolute;right:0;top:38px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:190px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.menu .pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:6px;color:var(--text);font:inherit;cursor:pointer}
.menu .pop button:hover{background:var(--accent-soft)}
.menu .pop .danger{color:#dc2626}
main{max-width:920px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:1.375rem;margin:0 0 4px}h2{font-size:1.0625rem;margin:26px 0 10px}h3{font-size:0.9375rem;margin:18px 0 8px}
.muted{color:var(--muted)}.small{font-size:0.8125rem}
.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:var(--text)}
a.card:hover{border-color:var(--accent);text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.card .ttl{font-weight:600;margin-bottom:8px}
.prog{height:6px;border-radius:4px;background:var(--line);overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog.full>i{background:var(--ok)}
.tag{display:inline-block;font-size:0.75rem;padding:1px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.resume{border-color:var(--accent);background:var(--accent-soft)}
.crumb{margin-bottom:10px;display:inline-block}
.tools{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:14px 0}
.tools label{font-weight:600;display:block;margin-bottom:4px}
input[type=text],input[type=search],textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input[type=text]:focus,input[type=search]:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
textarea{min-height:90px;resize:vertical}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.step{display:flex;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.step.done{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--ok-soft)),var(--surface)}
.step input[type=checkbox]{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer;flex:none}
.step .body{flex:1;min-width:0}
.step .num{font-size:0.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.step .t{font-weight:600}
.step .d{color:var(--muted);margin-top:2px}
.step.done .t{text-decoration:line-through;text-decoration-color:var(--muted)}
.cmd{display:flex;gap:8px;align-items:stretch;margin-top:8px}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;background:var(--code-bg);border-radius:8px;padding:7px 10px}
button.btn,.copy{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:5px 11px;font:inherit;font-size:0.8125rem;cursor:pointer;white-space:nowrap}
button.btn:hover,.copy:hover{border-color:var(--accent);color:var(--accent)}
.copy.ok{border-color:var(--ok);color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
details.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:12px 0}
details.box>summary{cursor:pointer;padding:11px 14px;font-weight:600}
details.box>.in{padding:0 16px 14px}
.md h1{font-size:1.125rem}.md h2{font-size:1rem;margin-top:18px}.md h3{font-size:0.9375rem}
.md p{margin:8px 0}.md ul,.md ol{margin:8px 0;padding-left:22px}
.md blockquote{margin:10px 0;padding:6px 12px;border-left:3px solid var(--warn);background:var(--warn-soft);border-radius:0 8px 8px 0}
.md :not(pre)>code{background:var(--code-bg);padding:1px 5px;border-radius:5px}
.md .code{position:relative;margin:10px 0}
.md pre{margin:0;background:var(--code-bg);border-radius:8px;padding:10px 12px;overflow-x:auto}
.md .code .copy{position:absolute;top:6px;right:6px;opacity:.85}
.md .tblw{overflow-x:auto;margin:10px 0}
.md table{border-collapse:collapse;min-width:100%}
.md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--code-bg)}
.md hr{border:0;border-top:1px solid var(--line);margin:16px 0}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:3px 12px;font:inherit;font-size:0.8125rem;cursor:pointer}
.chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.hit{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:10px 0}
.hit>summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hit>summary b{font-weight:600}
.hit>.md{padding:0 16px 12px}
.hit.pit>summary .tag{background:var(--warn-soft);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2330;color:#fff;padding:9px 16px;border-radius:10px;font-size:0.875rem;z-index:9;max-width:90vw}
footer{max-width:920px;margin:0 auto;padding:0 16px 40px;color:var(--muted);font-size:0.8125rem}
@media (max-width:560px){.cmd{flex-direction:column}.cmd .copy{align-self:flex-start}}
/* cai dat: cua so va nut cho */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:380px;width:100%;box-shadow:0 12px 36px rgba(0,0,0,.2)}
.modal h3{margin:0 0 14px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.seg button{flex:1;min-width:64px;padding:8px 6px}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.modal .br{display:flex;justify-content:flex-end;margin-top:2px}
/* than thien hon: hieu ung mem mai + vung cham lon hon */
a,.card,button.btn,.copy,.chip,nav a,.menu .pop button{transition:background .15s,border-color .15s,color .15s,box-shadow .15s}
.card{box-shadow:0 1px 2px rgba(16,24,40,.03)}
a.card:hover{box-shadow:0 4px 14px rgba(16,24,40,.08)}
button.btn,.copy{min-height:34px}
nav{overflow-x:auto;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.step{transition:border-color .15s,background .2s}
#btn-settings{font-size:16px;line-height:1;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted)}
#btn-settings:hover{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/">MMT-Lab</a>
  <nav><a href="#/" id="nav-home">Bài lab</a><a href="#/cmd" id="nav-cmd">Tra lệnh</a></nav>
  <button id="btn-settings" title="Cài đặt">⚙</button>
  <details class="menu"><summary>Dữ liệu ▾</summary><div class="pop">
    <button id="m-export">Xuất tiến độ (.json)</button>
    <button id="m-import">Nhập tiến độ…</button>
    <button id="m-reset" class="danger">Xóa toàn bộ tiến độ</button>
  </div></details>
  <input type="file" id="file-import" accept="application/json" hidden>
</div></header>
<main id="app"></main>
<footer>Tiến độ chỉ lưu trong trình duyệt này (localStorage); muốn mang sang máy khác thì dùng Dữ liệu → Xuất/Nhập. Trang không chấm được file .pkt: chạy lệnh <code>check.py</code> ở máy bạn.</footer>

   "de": "# Chương 1 - Thực hành 01: Xây dựng mạng, cấu hình IP và ping\n\nNguồn: slide \"Chương 1 - Thực hành\" (phần Bài tập).\n\n> **Lưu ý về dữ liệu.** Sơ đồ mạng và \"bảng thông số\" của bài này là hình, không có trong bản slide dạng chữ. Phần dưới chỉ gồm những gì có chữ. Tên thiết bị `LT0`, `PC0`, `S0`, `R0` lấy từ các bước trong slide; loại thiết bị là giả định hợp lý (laptop, PC, server, router 2811). Sửa `checks.json` nếu bạn đặt tên khác hoặc khi có đủ thông tin từ hình.\n\n## Bước 1 - Xây dựng mô hình\nĐưa thiết bị vào workspace (laptop, PC, server, router 2811, switch 2960) và nối cáp theo sơ đồ trong slide. Dùng cáp Straight-Through; Cross-Over chỉ để nối hai router.\n\n## Bước 2 - Cấu hình địa chỉ IP\n- **Đầu cuối** (LT0, PC0, S0 và các máy khác): Config > FastEthernet0, chọn Static, điền IPv4/IPv6 theo bảng thông số trong slide. Mọi PC, Laptop, Server cấu hình giống LT0.\n- **Router R0**, cổng Fa0/0 (từ slide):\n  - IPv4: `132.54.78.1` mask `255.255.255.0`\n  - IPv6: `2AB1:1D8C:ABBA::1/64`\n  - Cổng Fa0/1 làm tương tự theo bảng thông số (giá trị có trong hình, không có trong bản chữ).\n- Nhớ bật cổng (`no shut`).\n\n## Bước 3 - Kiểm tra kết nối\n- Trên đầu cuối: Command Prompt, `ping` IPv4 và IPv6 tới các thiết bị khác, xem kết quả.\n- Trên R0: CLI, `ping` v4/v6 tới các đầu cuối.\n\nGợi ý hướng kiểm tra: ping IPv6 giữa hai mạng khác nhau cần router bật `ipv6 unicast-routing`.\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-1/thuc-hanh-01-xay-dung-mang --step 2\n```\nBộ chấm chỉ kiểm tra thiết bị có mặt (bước 1) và địa chỉ, trạng thái cổng Fa0/0 của R0 (bước 2 trở đi). Các phần còn lại phụ thuộc vào hình slide.\n"

   "de": "# Chương 1 - Thực hành 02: Bài tập nộp\n\nNguồn: file đề \"Bài tập chương 1\" của môn. Lưu file `Hovaten_MSSV.pkt`.\n\n## Bước 1 - Thiết kế mô hình mạng\nDựng các thiết bị và nối cáp:\n\n| Thiết bị | Loại | Cổng | Nối tới |\n|---|---|---|---|\n| PC0 | PC-PT | Fa0 | Fa0/1 (Switch0) |\n| Laptop0 | Laptop-PT | Fa0 | Fa0/2 (Switch0) |\n| Server0 | Server-PT | Fa0 | Fa0/3 (Switch0) |\n| Switch0 | 2960-24TT | Fa0/4 | Fa0/0 (Router0) |\n| Switch1 | 2960-24TT | Fa0/1 | Fa0/1 (Router0) |\n| Router0 | 2811 | Fa0/0, Fa0/1 | Fa0/4 (Switch0), Fa0/1 (Switch1) |\n| Wireless Router0 | WRT300N | E1 | Fa0/2 (Switch1) |\n| Tablet PC0 | TabletPC-PT | không dây | |\n| Smartphone0 | Smartphone-PT | không dây | |\n\nTên thiết bị trong checks.json lấy theo tên mặc định của Packet Tracer (`Tablet PC0`, `Smartphone0`); đề viết `TabletPC0` không có dấu cách, nên nếu bạn đặt tên theo đề thì sửa lại cho khớp.\n\n## Bước 2 - Cấu hình địa chỉ IP các thiết bị\n| Thiết bị | IPv4 / mask | Default gateway v4 | IPv6 | Default gateway v6 |\n|---|---|---|---|---|\n| PC0 | 151.45.78.8 / 255.255.0.0 | 151.45.78.1 | 2001:DB8:3C4D:1::123/64 | 2001:DB8:3C4D:1::1 |\n| Laptop0 | 151.45.78.11 / 255.255.0.0 | 151.45.78.1 | | |\n| Server0 | 151.45.78.20 / 255.255.0.0 | 151.45.78.1 | 2001:DB8:3C4D:1::321/64 | 2001:DB8:3C4D:1::1 |\n| Router0 Fa0/0 | 151.45.78.1 / 255.255.0.0 | | 2001:DB8:3C4D:1::1/64 | |\n| Router0 Fa0/1 | 211.13.45.1 / 255.255.255.0 | | | |\n| Wireless Router0 | 211.13.45.10 / 255.255.255.0 | | | |\n\nGợi ý của đề: cấu hình Wireless Router0 (IP phía LAN, DHCP và SSID để máy không dây vào được).\n\n## Bước 3 - Kiểm tra kết nối\nQuan sát ping giữa các thiết bị với nhau; yêu cầu ping thành công giữa các thiết bị. Tablet PC0 và Smartphone0 cần kết nối vào router không dây và nhận địa chỉ trong mạng `211.13.45.0/24` thì mới ping được (đây là suy ra từ yêu cầu ping thành công, đề không ghi địa chỉ riêng cho hai máy này).\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-    "de": "# Chương 3 - Thực hành 02: Mạng kết nối, định tuyến tĩnh và mặc định\n\nNguồn: slide \"Chương 3 - Thực hành 02\" (Router 2811).\n\n> **Lưu ý về dữ liệu.** Bản slide dạng chữ không chứa hình topology, nên các thông tin chỉ có trong hình (địa chỉ máy trạm, mask của đường nối giữa hai router, cổng nào nối đâu) **chưa có ở đây**. Phần nào suy ra được từ chỗ khác của slide thì có ghi nguồn. Tên router trong bài tập 01 slide không nêu, `checks.json` giả định là `R-UTC`; sửa lại nếu bạn đặt tên khác.\n\n## Bước 1 - Bài tập 01: Mạng kết nối\nMột router, hai LAN:\n\n| LAN | IPv4 | IPv6 | Cổng router |\n|---|---|---|---|\n| LAN 1 | 99.100.31.0/24 | A1B3:4E1C::/64 | Fa0/0: 99.100.31.1 / `A1B3:4E1C::1` |\n| LAN 2 | 32.154.23.128/25 | 2DCF:A001::/64 | Fa0/1: 32.154.23.129 / `2DCF:A001::1` |\n\nViệc cần làm: đặt IP cho PC và Server (như hình slide), đặt IP cho hai cổng router, bật cổng, rồi xem `show ip route`, `show ipv6 route`, `show ip cef`, `show ipv6 cef`, `show protocols`. Ping giữa hai LAN.\n\nGợi ý hướng kiểm tra: `show ipv6 cef` chỉ chạy khi đã bật định tuyến IPv6; hai LAN chỉ ping được nhau khi có `ipv6 unicast-routing` cho IPv6.\n\n## Bước 2 - Bài tập 02: Hai router R-UTC và R-UTC2\nTừ các lệnh trong slide suy ra:\n\n| Mạng | IPv4 | IPv6 | Phía |\n|---|---|---|---|\n| NET1 | 55.14.92.0/24 | 24BB:7A1::/64 | sau R-UTC |\n| NET2 | 74.54.33.128/25 | 2DCF:4A6::/64 | sau R-UTC2 |\n| Đường nối hai router | R-UTC 212.96.8.253, R-UTC2 212.96.8.254 (mask: xem hình) | R-UTC `2FF2:B52::1`, R-UTC2 `2FF2:B52::2` | |\n\nCác suy luận từ slide khác (chương 5 thực hành 02, bài DHCP qua relay dùng lại topology này): R-UTC2 Fa0/0 là `74.54.33.129/25` (gateway của NET2); server N1 ở NET1 là `55.14.92.5/24`, `24BB:7A1::5/64`.\n\nLàm theo ba cách (slide yêu cầu tự làm cách 1 và 2, còn cách 3 có sẵn lệnh):\n1. Chỉ định tuyến tĩnh trên cả hai router.\n2. Chỉ định tuyến mặc định trên cả hai router.\n3. Tĩnh trên R-UTC, mặc định trên R-UTC2.\n\nMỗi tuyến cần cả IPv4 và IPv6, trỏ next-hop về cổng router đầu kia. Rồi chạy `show protocols` trên cả hai router và ping từ máy ở NET1 tới `74.54.33.131` và `2DCF:4A6::3` (các máy ở NET2).\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-3/thuc-hanh-02-dinh-tuyen --step 1\npython tools/check.py bai.pkt --lab labs/chuong-3/thuc-hanh-02-dinh-tuyen --step 2\n```\n- Bước 1 chấm bài tập 01, bước 2 chấm bài tập 02.\n- Bước 2 mô phỏng đường đi theo bảng định tuyến (kết nối, tĩnh, mặc định), nên **cả ba cách đều được chấp nhận**; nó báo router nào thiếu tuyến, next-hop sai hay chưa bật IPv6 routing.\n- Bộ chấm chỉ xét cấu hình router, không xét PC và không thay cho ping thật.\n"

   "de": "# Chương 5 - Thực hành 01: Dịch vụ DNS, WEB, MAIL\n\nNguồn: slide \"Chương 5 - Thực hành 01\".\n\n> **Lưu ý về dữ liệu.** Sơ đồ mạng của bài là hình, không có trong bản slide chữ. Tên máy chủ DNS (`L2 - DNSv4`, `L2 - DNSv6`) là giả định của mình; `L2 - UTC WEB`, `L2 - UTC MAIL` và `L1-PC0`, `L1-PC1`, `L1-PC2` lấy từ slide. Nếu bạn đặt tên khác, sửa `checks.json`. Bộ chấm kiểm tra **cấu hình dịch vụ** bằng cách tìm chuỗi trong dữ liệu của máy chủ (chưa phân biệt loại bản ghi), nên ping, nslookup, mở web và gửi thư vẫn phải tự thử.\n\n## Bước 1 - Bài tập 01: Dịch vụ DNS\n- Dựng topology, cấu hình R-UTC.\n- **DNSv4**: `113.20.118.6/24`, miền `UTC.EDU.VN`, máy chủ `NS-V4.UTC.EDU.VN`, bản ghi SOA, NS và A (`NS-V4.UTC.EDU.VN → 113.20.118.6`).\n- **DNSv6**: `2ABC:A4A9::7/64`, cùng miền, máy chủ `NS-V6.UTC.EDU.VN`, bản ghi SOA, NS và AAAA (`NS-V6.UTC.EDU.VN → 2ABC:A4A9::7`).\n- Đặt tham số DNS Server trên các PC; `nslookup` từ L1-PC0, PC1 tới DNSv4 và từ L1-PC1, PC2 tới DNSv6.\n\n## Bước 2 - Bài tập 02: Dịch vụ WEB\n- Máy chủ web **L2 - UTC WEB**: `113.20.118.5/24`, `2ABC:A4A9::5/64`; bật HTTP và HTTPS, tạo trang `utc.html`.\n- Từ PC LAN1 truy cập bằng IP (v4, v6, http và https), rồi thử `http://www.utc.edu.vn/utc.html` và giải thích kết quả.\n- Khai DNS: A `WWW.UTC.EDU.VN → 113.20.118.5` trên DNSv4, AAAA `WWW.UTC.EDU.VN → 2ABC:A4A9::5` trên DNSv6; truy cập lại bằng tên.\n\n## Bước 3 - Bài tập 03: Dịch vụ MAIL\n- DNS cho mail: A `MAIL.UTC.EDU.VN → 113.20.118.8`, AAAA `MAIL.UTC.EDU.VN → 2ABC:A4A9::8`.\n- Máy chủ **L2 - UTC MAIL**: `113.20.118.8/24`, `2ABC:A4A9::8/64`, domain `utc.edu.vn`, tạo tài khoản `aaa/123`, `bbb/234`, `ccc/345`.\n- Cấu hình email client: aaa trên L1-PC0, bbb trên L1-PC1, ccc trên L1-PC2.\n- bbb gửi thư cho aaa và ccc; aaa và ccc kiểm tra hộp thư, trả lời; bbb xem phản hồi.\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-5/thuc-hanh-01-dns-web-mail --step 2\n```\nLưu một file `.pkt` sau mỗi bước. Bước sau chấm lại cả c    "de": "# Chương 5 - Thực hành 02: Cấu hình DHCP\n\nNguồn: slide \"Chương 5 - Thực hành 02\". Ba bài là ba mạng riêng, nên mỗi bài lưu một file `.pkt` riêng và `--step N` chỉ chấm đúng bài đó.\n\n> **Lưu ý về dữ liệu.** Sơ đồ là hình, không có trong slide chữ. Bài 2 slide cho IPv6 của UTC-Server-01 chỉ trong hình, nên `checks.json` không kiểm tra IPv6 của máy chủ này. Tên `N2-PC1` lấy từ lệnh ping trong bài 3.\n\n## Bước 1 - Bài tập 01: Router cung cấp DHCP\nMạng LAN 1: `19.16.20.0/24`, `2001:DB8:1234:42::/64`. R-UTC Fa0/1 là `19.16.20.1/24`, `2001:DB8:1234:42::1/64`.\n- DHCPv4 pool `UTC-DHCPv4-pool`: loại trừ `19.16.20.1 - 19.16.20.30`, network `19.16.20.0/24`, default-router `19.16.20.1`, dns-server `194.0.1.18`.\n- DHCPv6 pool `UTC-DHCPv6-pool`: dns-server `2001:678:4::12`; trên Fa0/1 đặt `ipv6 nd other-config-flag` và `ipv6 dhcp server UTC-DHCPv6-pool`.\n- L1-PC1, L1-PC2 nhận IPv4/IPv6 từ DHCP; ping v4/v6 giữa hai máy và tới gateway.\n\n## Bước 2 - Bài tập 02: Máy chủ cung cấp DHCP\nMạng LAN 1: `101.12.31.0/24`, `20AB:6D:1:E2::/64`. R-UTC Fa0/1 là `101.12.31.1/24`, `20AB:6D:1:E2::1/64`; UTC-Server-01 là `101.12.31.3/24`.\n- DHCPv4 pool `serverPool` trên UTC-Server-01: gateway `101.12.31.1`, DNS `203.119.73.105`, start `101.12.31.40`, mask `255.255.255.0`, tối đa 20 người dùng.\n- DHCPv6 pool `serverPool-v6`: DNS `2001:DC8:1:2::105`, prefix `20AB:6D:1:E2::/64`.\n- L1-PC1, L1-PC2 nhận địa chỉ từ máy chủ; ping từ hai máy tới gateway và DHCP server.\n\n## Bước 3 - Bài tập 03: DHCP qua Router Relay\nTopology tham khảo chương 3 thực hành 02 (bài tập 02). Mạng N1 `55.14.92.0/24` phía R-UTC, mạng N2 `74.54.33.128/25` phía R-UTC2.\n- N1-SerUTC-1: `55.14.92.5/24`, `24BB:7A1::5/64`; DHCPv4 pool `serverPool`: gateway `74.54.33.129`, DNS `202.47.142.105`, start `74.54.33.149`, mask `255.255.255.128`, tối đa 30 người dùng.\n- R-UTC2: `ip helper-address 55.14.92.5` trên Fa0/0 (cổng phía N2, `74.54.33.129`).\n- Các PC của N2 nhận IPv4 từ máy chủ; ping từ N2-PC1 tới mọi host của N1. Slide lưu ý: Router 2811 (PT 8.1.1) không hỗ trợ DHCPv6 relay.\n\n## Chấm tự động\n```\npython tools/check.py bai1.pkt --lab labs/chuong-5/thuc-hanh-02-dhcp --step 1\npython tools/check.py bai3.pkt --lab labs/chuong-5/thuc-hanh-02-dhcp --step 3\n```\nBài 1 chấm cấu hình router đọc từ running-config. Bài 2 và 3 đọc cấu hình DHCP pool của máy chủ; riêng DHCPv6 trên máy chủ chỉ chấm theo chuỗi.\n"

   "de": "# Chương 6 - Thực hành 01: Triển khai hệ thống cho Trung tâm Thông tin - Thư viện\n\nNguồn: slide \"Chương 6 - Thực hành 01\". Bài nộp: `Chương 6 - Thực hành 01.zip` gồm file `.pkt` và file `.pdf` với 3 bảng (vị trí và chức năng, kết nối, địa chỉ IP).\n\n> **Lưu ý về dữ liệu.**\n> - Đây là bài **thiết kế**: tự chia mạng và tự đặt địa chỉ, nên bộ chấm kiểm tra *quan hệ* (kích thước mạng con, dải địa chỉ, không chồng lấn, dịch vụ) chứ không so địa chỉ cố định.\n> - Tên thiết bị trong slide có dấu cách và dấu gạch lạ (`SW- UTC Lib -A7`, `UTC Lib – S2`). `checks.json` dùng `R-UTC Lib`, `SW-UTC Lib-A8`, `SW-UTC Lib-A7`, `SW-UTC Lib-A6`, `UTC Lib - S1`, `UTC Lib - S2`; sửa lại nếu bạn đặt tên khác.\n> - Slide đặt tên pool là `UTC Lib-DHCPv4-pool` có dấu cách, nhưng tên pool trong IOS là một từ, nên bộ chấm không bắt buộc tên pool.\n\n## Yêu cầu\n- Nối các tòa A6, A7, A8, hỗ trợ IPv4 và IPv6; dịch vụ DNS, Web, Mail, DHCP; domain `lib.utc.edu.vn`.\n- Hai khối: giảng viên (GV: 40 người) và nghiên cứu sinh (NCS: 150 người), mỗi người một thiết bị cấp địa chỉ động.\n- Ba LAN: máy chủ (tối đa 12 máy), laptop GV, máy tính NCS.\n- Được cấp: IPv4 `69.251.30.0/23`, IPv6 `2018:2809::/48`; 1 router 2811 (có NM-2FE2W), 3 switch 2960, 2 server, PC (NCS) và laptop (GV).\n\n## Bước 1 - Lập kế hoạch và dựng thiết bị\nXác định bảng vị trí - chức năng, bảng kết nối, bảng địa chỉ IP và topology; dựng sáu thiết bị: `R-UTC Lib`, `SW-UTC Lib-A8`, `SW-UTC Lib-A7`, `SW-UTC Lib-A6`, `UTC Lib - S1` (DNS, DHCP cho NCS), `UTC Lib - S2` (Web, Mail). Bước chuẩn bị hạ tầng và cài đặt phần cứng không làm được trong lab.\n\n## Bước 2 - Cấu hình thiết bị mạng\n- **Chia mạng** (tự tính): chọn prefix nhỏ nhất đủ chỗ cho GV (40), NCS (150), máy chủ (12), cộng cổng router; IPv6 mỗi LAN một `/64` trong `2018:2809::/48`.\n- **Switch**: đặt tên, mật khẩu đặc quyền; A8 có ba VLAN (`3 UTC-SER`, `5 UTC-GV`, `7 UTC-NCS`), A7 và A6 có hai VLAN (GV, NCS); nối trunk giữa các switch, access cho thiết bị. Kết nối 1 PC và 1 laptop (tượng trưng) ở mỗi nơi.\n- **Router**: đặt tên, mật khẩu; địa chỉ các giao diện (v4 và v6); DHCPv4 và DHCPv6 cho mạng GV (dns-server là IPv4 của `UTC Lib - S1`, DHCPv6 theo mẫu slide).\n\n## Bước 3 - Cấu hình máy chủ và kiểm thử\n- **S1**: DNS cho `lib.utc.edu.vn` (SOA: Min TTL 86400, Retry 3600, Refresh 10800, Expiry 1209600; NS `NS.LIB.UTC.EDU.VN`; A và AAAA cho NS, WWW, MAIL); DHCP cho NCS (pool `serverPool`, tối đa 150 người dùng; `serverPool-v6`).\n- **S2**: Web `lib-utc.html` (\"Welcome to UTC Library\") qua HTTP và HTTPS; Mail với bốn tài khoản `gv-a6/pg6`, `gv-a7/pg7`, `ncs-a6/pn6`, `ncs-a7/pn7`.\n- Kiểm thử bằng ping, nslookup, trình duyệt và email client; hoàn thiện ba bảng tài liệu.\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-6/thuc-hanh-01-trien-khai-thu-vien --step 3\n```\nLưu một file `.pkt` sau mỗi bước. Bộ chấm không đọc được client (PC, laptop) vì slide không đặt tên, và DNS/mail chấm theo chuỗi như chương 5.\n"

   "de": "# Chương 6 - Thực hành 02: Bài tập tổng hợp (UTC và UTC2)\n\nNguồn: slide \"Chương 6 - Thực hành 02\". Bài nộp: `Chương 6 - Thực hành 02.zip` gồm file `.pkt` và file `.pdf` với 4 bảng (vị trí và chức năng, kết nối, quy hoạch địa chỉ IP, địa chỉ IP). Tự làm trong 6 tiết, nộp trong hai tuần.\n\n> **Lưu ý về dữ liệu.**\n> - Đây là bài **thiết kế**: bộ chấm kiểm tra quan hệ (prefix, không chồng lấn, DHCP theo mạng của cổng, định tuyến thông), không so địa chỉ cố định.\n> - Slide không đặt tên server và laptop. `checks.json` dùng `UTC-Server-01` (DNS, lúc đầu cả Web và Mail), `UTC-Server-02` (server mới ở bước 6 chạy Web và Mail), `UTC2-Server-01`. Sửa lại nếu bạn đặt tên khác.\n> - **Giả định về cổng router**, theo bảng của đề thi thử cùng bộ môn: R-UTC `Fa0/0` là VLAN 11, `Fa0/1` VLAN 10, `Fa1/0` VLAN 12, `Fa1/1` nối R-UTC2; R-UTC2 `Fa0/0` VLAN 21, `Fa0/1` VLAN 20, `Fa1/0` VLAN 22. Riêng `Fa1/0` của R-UTC (VLAN 12, nối `Fa0/3` của Sw-UTC-A2) và `Fa1/0` của R-UTC2 (VLAN 22, nối `Fa0/3` của Sw-UTC2) có trong slide. Các chỗ phụ thuộc giả định được chỉ rõ ở `checks.json` (bước 5 và 6 dùng cổng của R-UTC2).\n> - Slide không nói rõ phải cập nhật bản ghi `www`/`mail` trên DNS khi Web, Mail chuyển sang server mới ở bước 6; bộ chấm không kiểm tra điều này, bạn nên tự xem lại.\n\n## Quy hoạch VLAN và mạng\nDải IPv4 `116.154.208.0/23`, IPv6 `24C1:D8E0::/48`.\n\n| Mạng | IPv4 | IPv6 | VLAN |\n|---|---|---|---|\n| L1 | `/24` | `/64` | 12 (UTC-Cla) |\n| L2 | `/25` | `/64` | 22 (UTC2-Cla) |\n| L3 | `/26` | `/64` | 10 (UTC-Ser) |\n| L4 | `/27` | `/64` | 20 (UTC2-Ser) |\n| L5 | `/28` | `/64` | 11 (UTC-Vip) |\n| L6 | `/29` | `/64` | 21 (UTC2-Vip) |\n| L7 | `/30` | `/64` | nối R-UTC và R-UTC2 |\n\n## Bước 1 - Triển khai tại UTC A1\n1 router, 1 switch, 1 server, 5 laptop. Switch `Sw-UTC-A1` và router `R-UTC`, mật khẩu đặc quyền `UTC@123`; VLAN 10 `UTC-Ser` (server), VLAN 11 `UTC-Vip` (laptop ban lãnh đạo); địa chỉ, tốc độ, full duplex cho cổng router. Server: DNS `dns.utc.edu.vn` (miền `utc.edu.vn`); Web `www.utc.edu.vn` với file `utc-index.html` (\"UTC - THE WAY TO SUCCESS\"); Mail `mail.utc.edu.vn` với `vip1/123`, `vip2/234`, `vip3/345` (địa chỉ `vip1@utc.edu.vn`...). Kiểm tra kết nối, DNS, Web, Mail.\n\n## Bước 2 - Bổ sung các lớp ở tòa A2\nThêm module NM-2FE2W cho R-UTC, switch `Sw-UTC-A2` (mật khẩu `UTC@123`), 10 PC. `Fa1/0` của R-UTC nối `Fa0/3` của Sw-UTC-A2 (VLAN 12 `UTC-Cla`). Trunk giữa hai switch cho VLAN 10, 11, 12. DHCP trên R-UTC cho VLAN 12: pool `UTC-DHCPv4-pool`, loại trừ từ `.+1` đến `.+60` của L1, network L1 (`/24`), default-router `.+1`, dns-server là server DNS (`L3 .+3`). PC dùng DHCP, kiểm tra kết nối và dịch vụ.\n\n## Bước 3 - Phân hiệu UTC2 ở TP.HCM\nThêm switch `Sw-UTC2` (mật khẩu `UTC@123`) và 3 laptop (ban lãnh đạo UTC2, VLAN 21 `UTC2-Vip`), nối với router ở UTC. Kiểm tra kết nối và dịch vụ.\n\n## Bước 4 - IPv6\nDùng `24C1:D8E0::/48`, mỗi VLAN một `/64`. VLAN 12 được cấp IPv6 qua DHCP từ `Fa1/0` của R-UTC: pool `UTC-DHCPv6-pool`, dns-server là IPv6 của server DNS (`L3-v6 ::+3`). Kiểm tra kết nối và dịch vụ v4/v6.\n\n## Bước 5 - Nâng cấp theo chuyển đổi số\nThêm router `R-UTC2` (có NM-2FE2W) và server `UTC2-Server-01`; hai router nối nhau, các giao diện nối switch đặt tốc độ và full duplex. Tuyến mặc định trên R-UTC, tuyến tĩnh trên R-UTC2. DNS: khai miền `utc2.edu.vn` trên DNS của UTC. Web `www.utc2.edu.vn` với `utc2.html` (\"Welcome to UTC2, Ho Chi Minh City, Vietnam.\"); Mail `mail.utc2.edu.vn` với `vip12/123`, `vip22/234`, `vip32/345` (địa chỉ `vip1@utc2.edu.vn`...). Kiểm tra kết nối và dịch vụ hai miền.\n\n## Bước 6 - Rà soát và hoàn thiện\nTại UTC: DNS giữ nguyên trên server ban đầu; Web, Mail chuyển sang server mới `UTC-Server-02`. Tại UTC2: thêm VLAN 22 `UTC2-Cla` trên Sw-UTC2, `Fa0/3` của Sw-UTC2 nối `Fa1/0` của R-UTC2, thêm 10 PC. Kiểm tra toàn bộ.\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-6/thuc-hanh-02-tong-hop --step 4\n```\nLưu một file `.pkt` sau mỗi bước. Các bước sau chấm lại cả cấu hình của bước trước (trừ chỗ đề yêu cầu thay đổi, như Web, Mail chuyển server ở bước 6).\n"

   "de": "# Chương 6 - Thực hành 03: Thi thử (60 phút, làm trên Packet Tracer)\n\nNguồn: \"Thuyết minh đề\" của đề thi thử (phần A: thông tin cần thiết). Cán bộ coi thi không giải thích thêm.\n\n> **Lưu ý về dữ liệu.**\n> - File chỉ có phần A (tên thiết bị, bảng kết nối, quy hoạch địa chỉ). Phần yêu cầu cụ thể của đề (nếu có) không nằm trong file, nên bộ chấm kiểm tra trạng thái cuối: thiết bị, cáp, VLAN, địa chỉ, định tuyến thông.\n> - **Đề tự mâu thuẫn ở VLAN 21.** L6 là `/29` (chỉ có 6 địa chỉ máy, `.+1` đến `.+6`), nhưng bảng ghi `VL21-LT1 = .+7` (địa chỉ broadcast) và `VL21-LT2 = .+9` (nằm ngoài mạng). Hai máy này không đặt được IPv4 như bảng; bộ chấm chỉ kiểm tra IPv6 (`::+7`, `::+9`) cho hai máy đó. Nên hỏi người ra đề.\n> - Bảng địa chỉ không nêu dải cấp phát, nên bộ chấm không kiểm tra dải mà chỉ kiểm tra prefix, vị trí máy trong mạng và không chồng lấn.\n\n## Thiết bị\nSwitch 2960: `SW-UTC-01`, `SW-UTC-02`, `SW-UTC2-01`, `SW-UTC2-02`. Router 2811 (+NM-2FE2W): `R-UTC`, `R-UTC2`. PC `VL12-PC1/2`, `VL22-PC1/2`; Server `VL10-SV1/2`, `VL20-SV1/2`; Laptop `VL11-LT1/2`, `VL21-LT1/2`.\n\n## Bước 1 - Dựng thiết bị và kết nối\nNối theo bảng kết nối: ở mỗi tòa, ba cổng `Fa0/0`, `Fa0/1`, `Fa1/0` của router nối `Fa0/1`, `Fa0/2`, `Fa0/3` của switch 01; `Fa0/10`, `Fa0/11`, `Fa0/12` của switch 01 nối server, laptop, PC; `Gi0/1` hai switch nối nhau; switch 02 nối `Fa0/1`, `Fa0/2`, `Fa0/3` với server, laptop, PC; `Fa1/1` hai router nối nhau.\n\n## Bước 2 - VLAN, cổng access và trunk\nTòa UTC: VLAN 10 `UTC-SER`, 11 `UTC-VIP`, 12 `UTC-CLA`. Tòa UTC2: VLAN 20 `UTC2-SER`, 21 `UTC2-VIP`, 22 `UTC2-CLA`. Cổng switch ở VLAN tương ứng với thiết bị nối vào (cổng nối router theo VLAN của giao diện router: Fa0/0 là VLAN 11/21, Fa0/1 là VLAN 10/20, Fa1/0 là VLAN 12/22); `Gi0/1` là trunk.\n\n## Bước 3 - Địa chỉ IPv4 và IPv6\nĐộ dài prefix: L1 `/24` (VLAN 12), L2 `/25` (VLAN 22), L3 `/26` (VLAN 10), L4 `/27` (VLAN 20), L5 `/28` (VLAN 11), L6 `/29` (VLAN 21), L7 `/30` (nối hai router); IPv6 mỗi mạng `/64`, L1 lấy dải bé nhất rồi lần lượt L2, L3... Vị trí máy trong mạng (`.+n` và `::+n`):\n\n| Giao diện router | Địa chỉ | Máy | Địa chỉ |\n|---|---|---|---|\n| Fa0/0, Fa0/1, Fa1/0, Fa1/1 của R-UTC và R-UTC2 | `.+1`, `::+1` (riêng Fa1/1 của R-UTC2 là `.+2`, `::+2`) | VL12-PC1/2 | `.+2`, `.+4` |\n| | | VL22-PC1/2 | `.+6`, `.+8` |\n| | | VL11-LT1/2 | `.+3`, `.+5` |\n| | | VL21-LT1/2 | `.+7`, `.+9` (xem lưu ý) |\n| | | VL10-SV1/2, VL20-SV1/2 | `.+3`, `.+5` |\n\n## Bước 4 - Định tuyến thông\nHai router thấy nhau: dùng tuyến tĩnh hoặc mặc định (cả v4 và v6, nhớ bật định tuyến IPv6); mọi mạng của UTC và UTC2 ping thông nhau.\n\n## Chấm tự động\n```\npython tools/check.py bai.pkt --lab labs/chuong-6/thuc-hanh-03-thi-thu --step 4\n```\nLàm đủ trong 60 phút rồi chấm; chấm theo `--step` để xem phần nào còn sót.\n"

<script>
"use strict";
const DATA = JSON.parse(document.getElementById("lab-data").textContent);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const app = $("#app");

/* ---------- lưu trạng thái ---------- */
const KEY = "mmtlab:v1";
const blank = () => ({steps: {}, notes: {}, file: "bai.pkt", last: null, theme: "auto", fontSize: 16});
let S = blank(), warned = false;
try { const r = localStorage.getItem(KEY); if (r) S = Object.assign(blank(), JSON.parse(r)); } catch (e) {}

}
let toastT;
function toast(msg) {
  $(".toast")?.remove();
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
  clearTimeout(toastT); toastT = setTimeout(() => t.remove(), 3200);
}

/* ---------- cai dat: co chu + giao dien sang/toi ---------- */
function applyCfg() {

}
function openSettings() {

  });
}

/* ---------- markdown nhỏ (đủ cho de.md, cheatsheet, lỗi hay gặp) ---------- */
function inline(s) {
  const codes = [];
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return "\u0000" + (codes.length - 1) + "\u0000"; });
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => "<code>" + codes[i] + "</code>");
}
function splitRow(line) {
  line = line.trim().replace(/^\|/, "").replace(/\|$/, "");
  const cells = []; let cur = "", tick = false;
  for (const ch of line) {
    if (ch === "`") tick = !tick;
    if (ch === "|" && !tick) { cells.push(cur.trim()); cur = ""; } else cur += ch;
  }
  cells.push(cur.trim()); return cells;
}
const isSep = l => /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)*\|?\s*$/.test(l);
function md(src) {
  const L = src.replace(/\r\n/g, "\n").split("\n"); let out = "", i = 0;
  while (i < L.length) {
    const line = L[i];
    if (/^```/.test(line)) {
      const buf = []; i++;
      while (i < L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++;
      out += `<div class="code"><button class="copy" data-copy>Chép</button><pre><code>${esc(buf.join("\n"))}</code></pre></div>`;
    } else if (/^\s*$/.test(line)) { i++; }
    else if (/^#{1,3}\s/.test(line)) {
      const n = line.match(/^#+/)[0].length; out += `<h${n}>${inline(line.replace(/^#+\s+/, ""))}</h${n}>`; i++;
    } else if (/^---+\s*$/.test(line)) { out += "<hr>"; i++; }
    else if (/^>\s?/.test(line)) {
      const buf = [];
      while (i < L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/, ""));
      out += `<blockquote>${inline(buf.join(" "))}</blockquote>`;
    } else if (/^\s*\|/.test(line) && i + 1 < L.length && isSep(L[i + 1])) {
      const head = splitRow(line); i += 2; const rows = [];
      while (i < L.length && /^\s*\|/.test(L[i])) rows.push(splitRow(L[i++]));
      out += `<div class="tblw"><table><thead><tr>${head.map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>` +
        rows.map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("") + "</tbody></table></div>";
    } else if (/^\s*([-*]|\d+\.)\s+/.test(line)) {
      const ordered = /^\s*\d+\./.test(line), items = [];
      while (i < L.length && /^\s*([-*]|\d+\.)\s+/.test(L[i])) items.push(L[i++].replace(/^\s*([-*]|\d+\.)\s+/, ""));
      const tag = ordered ? "ol" : "ul";
      out += `<${tag}>${items.map(t => `<li>${inline(t)}</li>`).join("")}</${tag}>`;
    } else {
      const buf = [];
      while (i < L.length && !/^\s*$/.test(L[i]) && !/^(```|#{1,3}\s|>|\s*\||\s*([-*]|\d+\.)\s+|---)/.test(L[i])) buf.push(L[i++]);
      if (!buf.length) { buf.push(L[i++]); }
      out += `<p>${inline(buf.join(" "))}</p>`;
    }
  }
  return out;
}

/* ---------- tiện ích ---------- */
const fold = s => s.toLowerCase().replace(/đ/g, "d").normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const foldKeep = s => [...s].map(c => { const f = c.toLowerCase().replace("đ", "d").normalize("NFD")[0]; return f; }).join("");
function highlight(root, words) {
  if (!words.length) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const text = node.nodeValue, f = foldKeep(text);
    if (f.length !== text.length) continue;
    const ranges = [];
    for (const w of words) { let p = 0; while ((p = f.indexOf(w, p)) !== -1) { ranges.push([p, p + w.length]); p += w.length; } }
    if (!ranges.length) continue;
    ranges.sort((a, b) => a[0] - b[0]);
    const merged = [];
    for (const r of ranges) { const l = merged[merged.length - 1]; if (l && r[0] <= l[1]) l[1] = Math.max(l[1], r[1]); else merged.push(r.slice()); }
    const frag = document.createDocumentFragment(); let pos = 0;
    for (const [a, b] of merged) {
      if (a > pos) frag.append(text.slice(pos, a));
      const m = document.createElement("mark"); m.textContent = text.slice(a, b); frag.append(m); pos = b;
    }
    if (pos < text.length) frag.append(text.slice(pos));
    node.replaceWith(frag);
  }
}
async function copyText(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  if (btn) { const o = btn.textContent; btn.textContent = "Đã chép"; btn.classList.add("ok"); setTimeout(() => { btn.textContent = o; btn.classList.remove("ok"); }, 1200); }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-copy]"); if (!b) return;
  const src = b.dataset.copy ? b.dataset.copy : (b.parentElement.querySelector("code")?.textContent || "");
  copyText(src, b);
});

const labById = id => DATA.labs.find(l => l.id === id);
const doneOf = lab => lab.steps.filter(s => S.steps[lab.id]?.[s.n]).length;
const chapters = () => [...new Set([...DATA.labs.map(l => l.chapter), ...DATA.cheatsheets.map(c => c.chapter)].filter(Boolean))].sort((a, b) => a - b);
const fmtTime = ts => new Date(ts).toLocaleString("vi-VN", {hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit"});
const progBar = (d, n) => `<div class="prog ${d === n && n ? "full" : ""}"><i style="width:${n ? Math.round(d * 100 / n) : 0}%"></i></div>`;

/* ---------- trang chủ ---------- */

  const last = labById(S.last);
  if (last && doneOf(last) < last.steps.length) {

    h += `<a class="card resume" href="#/lab/${last.id}" style="margin:14px 0"><div class="small muted">Tiếp tục</div><div class="ttl">${esc(last.short)}</div><div class="small">Bước tiếp theo: <b>${next.n}</b>. ${inline(next.title)}</div></a>`;

      h += `<a class="card" href="#/cmd?src=${c.id}"><div class="ttl">${esc(c.short)}</div><span class="tag">Cheatsheet</span> <span class="small muted">${c.sections.length} mục</span></a>`;
    for (const l of DATA.labs.filter(l => l.chapter === ch)) {
      const d = doneOf(l), n = l.steps.length;
      h += `<a class="card" href="#/lab/${l.id}"><div class="ttl">${esc(l.short)}</div>${progBar(d, n)}<div class="small muted" style="margin-top:6px">${d}/${n} bước ${d === n && n ? '<span class="tag ok">xong</span>' : ""}</div></a>`;
    }
    h += "</div>";
  }
  h += `<details class="box"><summary>Lệnh công cụ khác</summary><div class="in md">` +
    `<p>Xem script đọc được gì từ file (khi chấm sai nghi do đọc file):</p><div class="code"><button class="copy" data-copy>Chép</button><pre><code>python tools/check.py bai.pkt --dump</code></pre></div>` +
    `<p>Giải mã để gửi Claude xem:</p><div class="code"><button class="copy" data-copy>Chép</button><pre><code>python tools/pkt2xml.py bai.pkt --summary --configs</code></pre></div></div></details>`;
  app.innerHTML = h;
}

/* ---------- trang một bài lab ---------- */
function cmdFor(lab, n) {
  let f = (S.file || "bai.pkt").replace(/\{n\}/g, n == null ? lab.steps.length : n);
  if (/\s/.test(f)) f = `"${f}"`;
  return `python tools/check.py ${f} --lab labs/${lab.id}` + (n == null ? "" : ` --step ${n}`);
}
function stepsHtml(lab) {
  return lab.steps.map(s => {
    const ts = S.steps[lab.id]?.[s.n];
    return `<li class="step ${ts ? "done" : ""}" data-n="${s.n}">
      <input type="checkbox" aria-label="Bước ${s.n} đã xong" ${ts ? "checked" : ""}>

        <div class="small muted" style="margin-top:6px">${s.checks} tiêu chí chấm${s.devices.length ? " · " + esc(s.devices.slice(0, 4).join(", ")) + (s.devices.length > 4 ? ` +${s.devices.length - 4}` : "") : ""}</div>
        <div class="cmd"><code>${esc(cmdFor(lab, s.n))}</code><button class="copy" data-copy="${esc(cmdFor(lab, s.n))}">Chép lệnh</button></div>
      </div></li>`;
  }).join("");
}
function labView(id) {
  const lab = labById(id);
  if (!lab) { app.innerHTML = `<p>Không tìm thấy bài <code>${esc(id)}</code>. <a href="#/">Về danh sách</a></p>`; return; }

  const pits = DATA.pitfalls.filter(p => p.chapter === lab.chapter), sheets = DATA.cheatsheets.filter(c => c.chapter === lab.chapter);
  app.innerHTML = `<a class="crumb small" href="#/">← Danh sách bài</a><h1>${esc(lab.title)}</h1>
    <div id="lab-prog"></div>

      <input type="text" id="pkt" value="${esc(S.file)}" spellcheck="false">
      <div class="small muted" style="margin-top:4px">Lưu một file .pkt sau mỗi bước. Có thể viết <code>{n}</code> để tự thay bằng số bước, ví dụ <code>bai-b{n}.pkt</code>. Chạy lệnh trong thư mục repo.</div>
      <div class="row" style="margin-top:8px"><span class="small muted">Chấm bước cuối:</span><code id="cmd-all" class="small">${esc(cmdFor(lab, null))}</code><button class="copy" id="cmd-all-copy" data-copy="${esc(cmdFor(lab, null))}">Chép</button></div></div>
    <ol class="steps" id="steps">${stepsHtml(lab)}</ol>
    <div class="row" style="margin-top:12px"><button class="btn" id="reset-lab">Làm lại bài này</button>${sheets.map(c => `<a class="btn" style="padding:5px 11px;border:1px solid var(--line);border-radius:8px" href="#/cmd?src=${c.id}">Cheatsheet: ${esc(c.short)}</a>`).join("")}</div>
    ${pits.length ? `<details class="box"><summary>Lỗi hay gặp ở chương ${lab.chapter} (${pits.length})</summary><div class="in md"><ol>${pits.map(p => `<li><strong>${inline(p.title)}</strong> ${inline(p.md)}</li>`).join("")}</ol></div></details>` : ""}
    <details class="box"><summary>Đề đầy đủ</summary><div class="in md">${md(lab.de)}</div></details>
    <details class="box"><summary>Ghi chú của tôi</summary><div class="in"><textarea id="note" placeholder="Lỗi mình đã gặp, lệnh hay quên...">${esc(S.notes[id] || "")}</textarea></div></details>`;
  const refresh = () => {
    const d = doneOf(lab), n = lab.steps.length;
    $("#lab-prog").innerHTML = `${progBar(d, n)}<div class="small muted" style="margin:6px 0 14px">${d}/${n} bước ${d === n ? "· hoàn thành" : ""}</div>`;
  };
  refresh();
  $("#steps").addEventListener("change", e => {
    if (e.target.type !== "checkbox") return;
    const li = e.target.closest(".step"), n = li.dataset.n;
    S.steps[id] = S.steps[id] || {};
    if (e.target.checked) S.steps[id][n] = Date.now(); else delete S.steps[id][n];
    save(); $("#steps").innerHTML = stepsHtml(lab); refresh();
  });
  $("#pkt").addEventListener("input", e => {
    S.file = e.target.value.trim() || "bai.pkt"; save();
    $("#steps").innerHTML = stepsHtml(lab);
    $("#cmd-all").textContent = cmdFor(lab, null); $("#cmd-all-copy").dataset.copy = cmdFor(lab, null);
  });
  $("#reset-lab").addEventListener("click", () => {
    if (!confirm("Bỏ tick mọi bước của bài này?")) return;
    delete S.steps[id]; save(); $("#steps").innerHTML = stepsHtml(lab); refresh();
  });
  let t; $("#note").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { S.notes[id] = e.target.value; save(); }, 400); });
}

/* ---------- tra lệnh ---------- */
function entries() {
  const e = [];
  for (const c of DATA.cheatsheets) {
    if (c.intro) e.push({src: c.id, label: c.short, head: "Giới thiệu", md: c.intro, kind: "sheet"});

  }
  for (const p of DATA.pitfalls) e.push({src: "loi-" + p.chapter, label: "Lỗi hay gặp · chương " + p.chapter, head: p.title.replace(/\.$/, ""), md: p.md, kind: "pit"});
  return e;
}
function cmdView(params) {
  const all = entries();
  const srcs = [...new Set(all.map(e => e.src))].map(s => ({id: s, label: all.find(e => e.src === s).label}));
  let q = params.get("q") || "", src = params.get("src") || "";
  app.innerHTML = `<h1>Tra lệnh</h1><p class="muted">Tìm trong cheatsheet và các lỗi hay gặp. Không cần gõ dấu tiếng Việt. Phím <kbd>/</kbd> để nhảy vào ô tìm.</p>

    <div class="chips" id="chips"></div><div id="res"></div>`;
  const render = () => {
    $("#chips").innerHTML = [{id: "", label: "Tất cả"}, ...srcs].map(s => `<button class="chip ${s.id === src ? "on" : ""}" data-src="${s.id}">${esc(s.label)}</button>`).join("");
    const words = fold(q).split(/\s+/).filter(Boolean);
    const hits = all.filter(e => (!src || e.src === src) && words.every(w => fold(e.head + " " + e.md).includes(w)));
    const res = $("#res");
    if (!hits.length) { res.innerHTML = `<p class="muted">Không có mục nào khớp${q ? ` "${esc(q)}"` : ""}.</p>`; return; }
    res.innerHTML = `<p class="small muted">${hits.length} mục${words.length ? "" : " (bấm để mở)"}</p>` + hits.map((e, i) =>
      `<details class="hit ${e.kind}" ${words.length || src ? "open" : ""}><summary><b>${inline(e.head)}</b><span class="tag">${esc(e.label)}</span></summary><div class="md">${e.kind === "pit" ? `<p>${inline(e.md)}</p>` : md(e.md)}</div></details>`).join("");
    if (words.length) $$("#res summary, #res .md").forEach(el => highlight(el, words));
  };
  render();
  const sync = () => { const p = new URLSearchParams(); if (q) p.set("q", q); if (src) p.set("src", src); history.replaceState(null, "", "#/cmd" + (p.toString() ? "?" + p : "")); };
  $("#q").addEventListener("input", e => { q = e.target.value; sync(); render(); });
  $("#chips").addEventListener("click", e => { const b = e.target.closest(".chip"); if (!b) return; src = b.dataset.src; sync(); render(); });
  if (q) $("#q").focus();
}

/* ---------- định tuyến ---------- */
function route() {
  const raw = location.hash.replace(/^#/, "") || "/", [path, qs] = raw.split("?"), params = new URLSearchParams(qs || "");
  $$("nav a").forEach(a => a.classList.remove("on"));
  window.scrollTo(0, 0);
  let m;
  if ((m = path.match(/^\/lab\/(.+)$/))) { $("#nav-home").classList.add("on"); labView(decodeURI(m[1])); }
  else if (path === "/cmd") { $("#nav-cmd").classList.add("on"); cmdView(params); }
  else { $("#nav-home").classList.add("on"); homeView(); }
}
addEventListener("hashchange", route);
document.addEventListener("keydown", e => {
  if (e.key !== "/" || /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  e.preventDefault();
  if (!location.hash.startsWith("#/cmd")) location.hash = "#/cmd";
  setTimeout(() => $("#q")?.focus(), 0);
});

/* ---------- menu dữ liệu ---------- */
const menu = $(".menu");
$("#m-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"}), a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = "mmt-lab-tien-do.json"; a.click(); URL.revokeObjectURL(a.href); menu.open = false;
});
$("#m-import").addEventListener("click", () => { $("#file-import").click(); menu.open = false; });
$("#file-import").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (typeof j !== "object" || !j || typeof j.steps !== "object") throw new Error("sai định dạng");
    S = Object.assign(blank(), j); save(); applyCfg(); route(); toast("Đã nhập tiến độ.");
  } catch (err) { toast("File không hợp lệ: " + err.message); }
  e.target.value = "";
});
$("#m-reset").addEventListener("click", () => {
  menu.open = false;
  if (!confirm("Xóa toàn bộ tiến độ, ghi chú và tên file đã lưu?")) return;
  S = blank(); save(); applyCfg(); route(); toast("Đã xóa.");
});
document.addEventListener("click", e => { if (menu.open && !menu.contains(e.target)) menu.open = false; });
$("#btn-settings").addEventListener("click", openSettings);

applyCfg();
route();
</script>
</body>
